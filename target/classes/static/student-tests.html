<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tests | Learning Platform</title>
    <meta name="description" content="View and take your scheduled tests and quizzes.">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="app-container">
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <i class="fa-solid fa-graduation-cap brand-icon"></i>
            Student Portal
        </div>
        <ul class="nav-links">
            <li><a href="student.html" class="nav-item"><i class="fa-solid fa-house"></i>My Learning</a></li>
            <li><a href="student-tests.html" class="nav-item active"><i class="fa-solid fa-file-pen"></i>My Tests</a></li>
            <li><a href="student-profile.html" class="nav-item"><i class="fa-solid fa-circle-user"></i>My Profile</a></li>
            <li><a href="student-settings.html" class="nav-item"><i class="fa-solid fa-sliders"></i>Settings</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <button class="icon-btn" id="mobile-menu-btn" style="display:none;"><i class="fa-solid fa-bars"></i></button>
            <div class="header-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search tests...">
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="global-theme-toggle" title="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
                <button class="icon-btn" id="student-notifications-btn" title="Notifications">
                    <i class="fa-regular fa-bell"></i>
                    <span class="notification-badge" id="student-notif-badge" style="display:none;">0</span>
                </button>
                <div class="profile-menu">
                    <img src="" alt="Student" class="profile-avatar" id="student-avatar">
                    <div class="profile-info"><h4 id="student-name">Student</h4><p>Learner</p></div>
                    <i class="fa-solid fa-chevron-down" style="font-size:12px;color:var(--text-muted);"></i>
                </div>
            </div>
            <div class="notifications-dropdown" id="student-notifications-dropdown">
                <div class="notifications-header">
                    <h3>Notifications</h3>
                    <button class="mark-all-read" id="mark-all-read-btn">Mark all as read</button>
                </div>
                <div class="notifications-list" id="student-notifications-list">
                    <div class="notifications-empty"><i class="fa-regular fa-bell"></i> No notifications yet</div>
                </div>
            </div>
        </header>

        <div class="page-container animate-fade-in">
            <div class="page-header">
                <div class="page-title">
                    <h1>My Tests</h1>
                    <p>View all your assigned tests. Start a test during its scheduled window.</p>
                </div>
            </div>

            <!-- Test Status Filter Tabs -->
            <div class="test-filter-tabs" style="margin-bottom:24px;">
                <button class="test-tab active" data-filter="all">All Tests</button>
                <button class="test-tab" data-filter="LIVE">🔴 Live Now</button>
                <button class="test-tab" data-filter="UPCOMING">⏰ Upcoming</button>
                <button class="test-tab" data-filter="COMPLETED">✅ Completed</button>
                <button class="test-tab" data-filter="EXPIRED">Expired</button>
            </div>

            <!-- Tests Grid -->
            <div id="tests-container">
                <div style="color:var(--text-muted);padding:60px;text-align:center;">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size:36px;margin-bottom:16px;display:block;"></i>
                    Loading your tests...
                </div>
            </div>
        </div>
    </main>
</div>
<script src="app.js?v=1.0.1"></script>
</body>
</html>
