<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | Learning Platform</title>
    <meta name="description" content="Your personal learning dashboard. Access all your courses and track your progress.">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <i class="fa-solid fa-graduation-cap brand-icon"></i>
                Student Portal
            </div>
            <ul class="nav-links">
                <li>
                    <a href="student.html" class="nav-item active">
                        <i class="fa-solid fa-house"></i>
                        My Learning
                    </a>
                </li>
                <li>
                    <a href="student-tests.html" class="nav-item">
                        <i class="fa-solid fa-file-pen"></i>
                        My Tests
                    </a>
                </li>
                <li>
                    <a href="student-profile.html" class="nav-item">
                        <i class="fa-solid fa-circle-user"></i>
                        My Profile
                    </a>
                </li>
                <li>
                    <a href="student-settings.html" class="nav-item">
                        <i class="fa-solid fa-sliders"></i>
                        Settings
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="top-header">
                <button class="icon-btn" id="mobile-menu-btn" style="display: none;">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="header-search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search my courses...">
                </div>
                <div class="header-actions">
                    <button class="icon-btn" id="global-theme-toggle" title="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
                    <button class="icon-btn" id="student-notifications-btn" title="Notifications">
                        <i class="fa-regular fa-bell"></i>
                        <span class="notification-badge" id="student-notif-badge" style="display: none;">0</span>
                    </button>
                    <div class="profile-menu">
                        <img src="" alt="Student" class="profile-avatar" id="student-avatar">
                        <div class="profile-info">
                            <h4 id="student-name">Student</h4>
                            <p>Learner</p>
                        </div>
                        <i class="fa-solid fa-chevron-down" style="font-size: 12px; color: var(--text-muted);"></i>
                    </div>
                </div>

                <!-- Notifications Dropdown -->
                <div class="notifications-dropdown" id="student-notifications-dropdown">
                    <div class="notifications-header">
                        <h3>Notifications</h3>
                        <button class="mark-all-read" id="mark-all-read-btn">Mark all as read</button>
                    </div>
                    <div class="notifications-list" id="student-notifications-list">
                        <div class="notifications-empty">
                            <i class="fa-regular fa-bell"></i>
                            No notifications yet
                        </div>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <div class="page-container animate-fade-in">
                <div class="page-header">
                    <div class="page-title">
                        <h1>Welcome Back!</h1>
                        <p>Ready to continue your learning journey? Browse available courses below.</p>
                    </div>
                </div>

                <div class="glass-panel" style="padding: 24px; margin-bottom: 24px;">
                    <div class="panel-header">
                        <h2 class="panel-title"><i class="fa-solid fa-book-open-reader" style="color: var(--accent-blue); margin-right: 8px;"></i>Available Courses</h2>
                    </div>
                    <div class="course-grid" id="my-courses-container">
                        <!-- Courses loaded by JS from API -->
                        <div style="color: var(--text-muted); padding: 40px; text-align: center; grid-column: 1/-1;">
                            <i class="fa-solid fa-spinner fa-spin" style="font-size: 32px; display: block; margin-bottom: 12px;"></i>
                            Loading courses...
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js?v=1.0.1"></script>
</body>
</html>
