spring.application.name=learning-platform

# H2 In-Memory Database Configuration (Default)
spring.datasource.url=jdbc:h2:mem:learning_platform;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate Configuration for H2
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# MySQL Configuration (To use MySQL: uncomment lines below and comment out H2 configurations above)
# spring.datasource.url=jdbc:mysql://localhost:3306/learning_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=7845077390rOSE@
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload and Request Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=10MB
server.tomcat.max-http-form-post-size=10MB


